<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" role="img" aria-label="Why choose MercuReal: quality, speed, security, support">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1330"/>
      <stop offset="1" stop-color="#142252"/>
    </linearGradient>
    <radialGradient id="orb" cx="35%" cy="30%" r="80%">
      <stop offset="0" stop-color="#3a5bc0"/>
      <stop offset="1" stop-color="#0f1b3d"/>
    </radialGradient>
  </defs>
  <style>
    .t { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; text-anchor: middle; }
    .h { font-size: 20px; font-weight: 700; fill: #ffffff; }
    .d { font-size: 14px; fill: #a9b8cf; }
  </style>

  <rect width="1200" height="260" rx="28" fill="url(#panel)"/>

  <!-- separators -->
  <rect x="300" y="50" width="1" height="160" fill="#9fe8ff" fill-opacity="0.15"/>
  <rect x="600" y="50" width="1" height="160" fill="#9fe8ff" fill-opacity="0.15"/>
  <rect x="900" y="50" width="1" height="160" fill="#9fe8ff" fill-opacity="0.15"/>

  <!-- Quality -->
  <circle cx="150" cy="80" r="36" fill="url(#orb)" stroke="#9fe8ff" stroke-opacity="0.7"/>
  <circle cx="150" cy="80" r="46" fill="none" stroke="#9fe8ff" stroke-opacity="0.2">
    <animate attributeName="r" values="42;50;42" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values="0.3;0;0.3" dur="4s" repeatCount="indefinite"/>
  </circle>
  <text class="t" x="150" y="91" font-size="30">✨</text>
  <text class="t h" x="150" y="155">Quality First</text>
  <text class="t d" x="150" y="183">Clean code and polished</text>
  <text class="t d" x="150" y="203">interfaces in every project.</text>

  <!-- Speed -->
  <circle cx="450" cy="80" r="36" fill="url(#orb)" stroke="#9fe8ff" stroke-opacity="0.7"/>
  <circle cx="450" cy="80" r="46" fill="none" stroke="#9fe8ff" stroke-opacity="0.2">
    <animate attributeName="r" values="42;50;42" dur="4s" begin="1s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values="0.3;0;0.3" dur="4s" begin="1s" repeatCount="indefinite"/>
  </circle>
  <text class="t" x="450" y="91" font-size="30">⚡</text>
  <text class="t h" x="450" y="155">Built for Speed</text>
  <text class="t d" x="450" y="183">Optimised to load fast and</text>
  <text class="t d" x="450" y="203">run smoothly on any device.</text>

  <!-- Security -->
  <circle cx="750" cy="80" r="36" fill="url(#orb)" stroke="#9fe8ff" stroke-opacity="0.7"/>
  <circle cx="750" cy="80" r="46" fill="none" stroke="#9fe8ff" stroke-opacity="0.2">
    <animate attributeName="r" values="42;50;42" dur="4s" begin="2s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values="0.3;0;0.3" dur="4s" begin="2s" repeatCount="indefinite"/>
  </circle>
  <text class="t" x="750" y="91" font-size="30">🔒</text>
  <text class="t h" x="750" y="155">Secure by Design</text>
  <text class="t d" x="750" y="183">Safe practices from the first</text>
  <text class="t d" x="750" y="203">line of code to deployment.</text>

  <!-- Support -->
  <circle cx="1050" cy="80" r="36" fill="url(#orb)" stroke="#9fe8ff" stroke-opacity="0.7"/>
  <circle cx="1050" cy="80" r="46" fill="none" stroke="#9fe8ff" stroke-opacity="0.2">
    <animate attributeName="r" values="42;50;42" dur="4s" begin="3s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values="0.3;0;0.3" dur="4s" begin="3s" repeatCount="indefinite"/>
  </circle>
  <text class="t" x="1050" y="91" font-size="30">🤝</text>
  <text class="t h" x="1050" y="155">Real Support</text>
  <text class="t d" x="1050" y="183">A partner you can reach</text>
  <text class="t d" x="1050" y="203">before and after launch.</text>
</svg>

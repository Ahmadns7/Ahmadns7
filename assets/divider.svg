  </defs>
  <rect x="100" y="11" width="1000" height="2" fill="url(#line)"/>
  <circle cx="100" cy="12" r="4" fill="#9fe8ff">
    <animate attributeName="cx" values="100;1100;100" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="600" cy="12" r="6" fill="none" stroke="#9fe8ff" stroke-opacity="0.8"/>
  <circle cx="600" cy="12" r="2.5" fill="#9fe8ff"/>
</svg>

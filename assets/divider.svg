<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 24" width="1200" height="24" role="presentation">
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9fe8ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#9fe8ff" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#9fe8ff" stop-opacity="0"/>
